name: Deploy to GitHub Pages

on:
  push:
    branches: [trunk]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            emacs \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-fonts-recommended

      - name: Install org-re-reveal
        run: |
          mkdir -p ~/.emacs.d/lisp
          curl -fsSL https://raw.githubusercontent.com/emacsmirror/org-re-reveal/master/org-re-reveal.el \
            -o ~/.emacs.d/lisp/org-re-reveal.el

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install Puppeteer
        run: npm install -g puppeteer

      - name: Publish
        run: make publish

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v5
